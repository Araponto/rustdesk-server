# Araponto build: static linux amd64 binaries, same toolchain as upstream build.yaml.
# Dispatched manually with the git ref to build (an upstream tag such as 1.1.16, or an araponto/* branch).
# Tag pushes named ara-* build too. Upstream tag patterns are not used here, so the Docker jobs in
# build.yaml never run in this fork.
name: araponto-build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to build (tag, branch or sha)"
        required: true
        default: "master"
  push:
    tags:
      - "ara-*"

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.90"
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: ${{ env.TARGET }}

      - name: Test
        run: cargo test --release --all-features

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ env.TARGET }}
          use-cross: true

      - name: Checksums
        run: |
          cd target/${{ env.TARGET }}/release
          chmod a+x hbbs hbbr rustdesk-utils
          sha256sum hbbs hbbr rustdesk-utils | tee SHA256SUMS
          echo "commit $(git rev-parse HEAD)" >> SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-amd64
          path: |
            target/${{ env.TARGET }}/release/hbbs
            target/${{ env.TARGET }}/release/hbbr
            target/${{ env.TARGET }}/release/rustdesk-utils
            target/${{ env.TARGET }}/release/SHA256SUMS
          if-no-files-found: error

      - name: Release (ara-* tags)
        if: startsWith(github.ref, 'refs/tags/ara-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ env.TARGET }}/release
          gh release create "${GITHUB_REF_NAME}" hbbs hbbr rustdesk-utils SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
            --notes "Built from $(git rev-parse HEAD). Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
